services:
  mysql_db:
    image: mysql:8.0
    container_name: recipe_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass2026!
      MYSQL_DATABASE: recipe_db
      MYSQL_USER: recipe_user
      MYSQL_PASSWORD: RecipeSecurePass2026!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: recipe_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: RootSecurePass2026!
    networks:
      - backend_net
    depends_on:
      - mysql_db

  recipe_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: recipe_web
    restart: always
    environment:
      DB_HOST: mysql_db
      DB_NAME: recipe_db
      DB_USER: recipe_user
      DB_PASS: RecipeSecurePass2026!
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - mysql_db

  nginx_proxy:
    image: nginx:alpine
    container_name: recipe_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
    depends_on:
      - recipe_app

  # ---------------- MONITORING SERVICES ----------------
  mysqld_exporter:
    image: prom/mysqld-exporter:latest
    container_name: recipe_mysql_exporter
    restart: always
    volumes:
      - ./monitoring/prometheus/.my.cnf:/.my.cnf:ro
    command:
      - "--config.my-cnf=/.my.cnf"
    networks:
      - backend_net
      - monitoring_net
    depends_on:
      - mysql_db

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: recipe_cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net

  prometheus:
    image: prom/prometheus:latest
    container_name: recipe_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:latest
    container_name: recipe_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=AdminSecurePass2026!
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
