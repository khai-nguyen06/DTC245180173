services:
  mysql_db:
    image: mysql:8.0
    container_name: recipe_mysql
    security_opt:
      - no-new-privileges:true
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: recipe_db
      MYSQL_USER: recipe_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: recipe_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
    networks:
      - backend_net
    depends_on:
      - mysql_db

  recipe_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: recipe_web
    security_opt:
      - no-new-privileges:true
    restart: always
    environment:
      DB_HOST: mysql_db
      DB_NAME: recipe_db
      DB_USER: recipe_user
      DB_PASS: ${MYSQL_PASSWORD}
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - mysql_db

  nginx_proxy:
    image: nginx:alpine
    container_name: recipe_nginx
    security_opt:
      - no-new-privileges:true
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
      - monitoring_net
    depends_on:
      - recipe_app

  mysqld_exporter:
    image: prom/mysqld-exporter:latest
    container_name: recipe_mysql_exporter
    restart: always
    volumes:
      - ./monitoring/prometheus/.my.cnf:/.my.cnf:ro
    command:
      - "--config.my-cnf=/.my.cnf"
    networks:
      - backend_net
      - monitoring_net
    depends_on:
      - mysql_db

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: recipe_cadvisor
    restart: always
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net

  prometheus:
    image: prom/prometheus:latest
    container_name: recipe_prometheus
    security_opt:
      - no-new-privileges:true
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:latest
    container_name: recipe_grafana
    security_opt:
      - no-new-privileges:true
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
      - logging_net
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: recipe_loki
    restart: always
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - logging_net

  promtail:
    image: grafana/promtail:latest
    container_name: recipe_promtail
    restart: always
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logging_net
    depends_on:
      - loki
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: recipe_nginx_exporter
    restart: always
    command: ["--nginx.scrape-uri=http://nginx_proxy:8081/stub_status"]
    networks:
      - monitoring_net
    depends_on:
       - nginx_proxy
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge
  logging_net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
