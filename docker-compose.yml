services:
  mysql_db:
    image: mysql:8.0
    container_name: recipe_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass2026!
      MYSQL_DATABASE: recipe_db
      MYSQL_USER: recipe_user
      MYSQL_PASSWORD: RecipeSecurePass2026!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: recipe_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: RootSecurePass2026!
    networks:
      - backend_net
    depends_on:
      - mysql_db

  recipe_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: recipe_web
    restart: always
    environment:
      DB_HOST: mysql_db
      DB_NAME: recipe_db
      DB_USER: recipe_user
      DB_PASS: RecipeSecurePass2026!
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - mysql_db

  nginx_proxy:
    image: nginx:alpine
    container_name: recipe_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
    depends_on:
      - recipe_app

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  mysql_data:
